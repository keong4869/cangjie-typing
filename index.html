<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>JOE蛇 倉頡打字練習站</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
  background: linear-gradient(135deg, #a8e6ff, #ffe6a8); min-height: 100vh; color: #333; }
header { background: #ff8c42; color: white; padding: 15px 25px;
  display: flex; justify-content: space-between; align-items: center;
  box-shadow: 0 3px 10px rgba(0,0,0,0.15); }
header h1 { font-size: 24px; }
#userInfo { font-size: 16px; background: rgba(255,255,255,0.3); padding: 6px 14px; border-radius: 20px; }
.screen { display: none; padding: 30px 20px; max-width: 800px; margin: 0 auto; }
.screen.active { display: block; }
h2 { text-align: center; margin-bottom: 20px; color: #d35400; }
input[type="text"] { width: 100%; padding: 14px; font-size: 20px;
  border: 3px solid #ffb347; border-radius: 12px; margin-bottom: 15px; text-align: center; }
button { display: block; width: 100%; padding: 14px; font-size: 18px; font-weight: bold;
  background: #ff8c42; color: white; border: none; border-radius: 12px; cursor: pointer;
  transition: transform 0.1s, background 0.2s; }
button:hover { background: #e67e22; }
button:active { transform: scale(0.97); }
.btn-secondary { background: #4a90e2; margin-top: 15px; }
.btn-secondary:hover { background: #357abd; }
.btn-small { width: auto; padding: 10px 16px; font-size: 15px; background: #fff;
  color: #d35400; border: 2px solid #ffb347; display: inline-block; margin: 5px; }
.level-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px; margin-bottom: 20px; }
.level-card { background: white; border: 3px solid #ffb347; border-radius: 14px;
  padding: 15px; text-align: center; cursor: pointer; transition: transform 0.15s; }
.level-card:hover { transform: translateY(-4px); box-shadow: 0 6px 14px rgba(0,0,0,0.15); }
.level-card .level-num { font-size: 24px; font-weight: bold; color: #ff8c42; }
.level-card .level-name { font-size: 14px; margin-top: 6px; color: #666; }
.level-card .level-count { font-size: 11px; color: #aaa; margin-top: 4px; }
.practice-header { display: flex; justify-content: space-between; font-size: 16px;
  font-weight: bold; color: #d35400; margin-bottom: 15px; background: white;
  padding: 10px 16px; border-radius: 10px; }
.question-box { background: white; border-radius: 20px; padding: 40px 30px;
  text-align: center; margin-bottom: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1);
  min-height: 200px; display: flex; align-items: center; justify-content: center;
  flex-direction: column; }
#questionChar { font-size: 120px; font-weight: bold; color: #2c3e50; }
#contextDisplay { font-size: 42px; letter-spacing: 6px; line-height: 1.8;
  color: #2c3e50; word-break: break-all; }
#contextDisplay .article-title { font-size: 16px; color: #999; letter-spacing: 1px;
  margin-bottom: 20px; }
#contextDisplay .current-char { color: #e74c3c; font-weight: bold;
  border-bottom: 4px solid #e74c3c; padding-bottom: 2px; }
.feedback { text-align: center; font-size: 20px; font-weight: bold; min-height: 30px; margin: 10px 0; }
.feedback.correct { color: #27ae60; }
.feedback.wrong { color: #e74c3c; }
.practice-footer { text-align: center; margin-top: 15px; }
#scoreContent { background: white; padding: 20px; border-radius: 14px; line-height: 1.9; font-size: 16px; }
</style>
</head>
<body>

<header>
  <h1>⌨️ JOE蛇倉頡打字練習站</h1>
  <div id="userInfo">未登入</div>
</header>

<section id="screen-login" class="screen active">
  <h2>請輸入你的名字</h2>
  <input type="text" id="playerName" placeholder="例如：陳小明" maxlength="10">
  <button onclick="login()">開始學習</button>
</section>

<section id="screen-levels" class="screen">
  <h2>選擇關卡</h2>
  <div id="levelList" class="level-list"></div>
  <button class="btn-secondary" onclick="showScores()">📊 查看成績</button>
</section>

<section id="screen-practice" class="screen">
  <div class="practice-header">
    <span id="levelTitle">關卡</span>
    <span id="progress">0 / 0</span>
    <span id="timer">⏱ 00:00</span>
    <span id="score">⭐ 0</span>
  </div>
  <div class="question-box">
    <div id="questionChar">日</div>
    <div id="contextDisplay"></div>
  </div>
  <input type="text" id="answerInput" placeholder="輸入倉頡碼..." autocomplete="off" maxlength="5">
  <div class="feedback" id="feedback"></div>
  <div class="practice-footer">
    <button class="btn-small" onclick="skipQuestion()">⏭ 跳過</button>
    <button class="btn-small" onclick="quitPractice()">🏠 返回</button>
  </div>
</section>

<section id="screen-scores" class="screen">
  <h2>我的成績</h2>
  <div id="scoreContent"></div>
  <button class="btn-secondary" onclick="showLevels()">返回關卡</button>
</section>

<section id="screen-result" class="screen">

  <div id="resultContent"></div>
  <button onclick="showLevels()">返回關卡</button>

// ===== 狀態 =====
let currentUser = "";

let timerInterval = null;
let seconds = 0;

// ===== 畫面切換 =====
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// ===== 登入 =====
function login() {
  const name = document.getElementById("playerName").value.trim();
  if (!name) { alert("請輸入名字！"); return; }
  currentUser = name;
  document.getElementById("userInfo").textContent = "👤 " + name;
  showLevels();
}

// ===== 關卡列表 =====
function showLevels() {
  const list = document.getElementById("levelList");
  list.innerHTML = "";
  LEVELS.forEach(level => {
    let count = 0;
    if (level.isArticle) {
      level.articles.forEach(article => {
        article.lines.forEach(line => {
          for (let i = 0; i < line.text.length; i++) {
            const ch = line.text[i];
            if (ch !== "，" && ch !== "。" && ch !== "、" && ch !== " ") count++;
          }
        });
      });
    } else {
      count = Object.keys(level.chars).length;
    }
    const card = document.createElement("div");
    card.className = "level-card";
    card.innerHTML = `<div class="level-num">第 ${level.id} 關</div>
                      <div class="level-name">${level.name}</div>
                      <div class="level-count">${count > 0 ? count + " 個字" : "待補充"}</div>`;
    if (count > 0) {
      card.onclick = () => startLevel(level);
    } else {
      card.style.opacity = "0.5";
      card.onclick = () => alert("此關卡尚未加入題目。");
    }
    list.appendChild(card);
  });
  showScreen("screen-levels");
}

// ===== 開始關卡 =====
function startLevel(level) {
  currentLevel = level;

  if (level.isArticle) {
    currentQuestions = [];
    level.articles.forEach(article => {
      article.lines.forEach(line => {
        for (let i = 0; i < line.text.length; i++) {
          const ch = line.text[i];
          if (ch === "，" || ch === "。" || ch === "、" || ch === " ") continue;
          const code = line.codes[i];
          if (code) {
            currentQuestions.push({
              char: ch,
              code: code,
              articleTitle: article.title,
              context: line.text,
              contextIndex: i
            });
          }
        }
      });
    });
  } else {
    currentQuestions = Object.entries(level.chars)
      .filter(([_, v]) => {
        if (typeof v === "object") return v && v.code;
        return v && v.trim() !== "";
      })
      .map(([char, v]) => {
        if (typeof v === "object") {
          return { char, code: v.code, img: v.img };
        }
        return { char, code: v };
      });
  }

  if (currentQuestions.length === 0) { alert("此關卡尚無題目！"); return; }

  if (!level.isArticle) shuffle(currentQuestions);

  currentIndex = 0; score = 0; correctCount = 0; wrongList = []; seconds = 0;

  document.getElementById("levelTitle").textContent = `第 ${level.id} 關：${level.name}`;
  document.getElementById("feedback").textContent = "";
  document.getElementById("answerInput").value = "";
  document.getElementById("answerInput").disabled = false;

  startTimer();
  loadQuestion();
  showScreen("screen-practice");
  document.getElementById("answerInput").focus();
}

// ===== 計時器 =====
function startTimer() {
  clearInterval(timerInterval);
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    seconds++;
    updateTimerDisplay();
  }, 1000);
}

function updateTimerDisplay() {
  const m = String(Math.floor(seconds / 60)).padStart(2, "0");
  const s = String(seconds % 60).padStart(2, "0");
  document.getElementById("timer").textContent = `⏱ ${m}:${s}`;
}

// ===== 出題 =====
function loadQuestion() {
  if (currentIndex >= currentQuestions.length) { endLevel(); return; }
  const q = currentQuestions[currentIndex];
  const displayEl = document.getElementById("questionChar");
  const contextEl = document.getElementById("contextDisplay");

  if (q.img) {
    displayEl.style.display = "";
    contextEl.style.display = "none";
    displayEl.innerHTML = `<img src="${q.img}" style="max-width:150px; max-height:150px;" alt="${q.char}">`;
  } else if (q.context) {
    displayEl.style.display = "none";
    contextEl.style.display = "";
    let html = `<div class="article-title">— ${q.articleTitle}</div>`;
    html += `<div>`;
    for (let i = 0; i < q.context.length; i++) {
      if (i === q.contextIndex) {
        html += `<span class="current-char">${q.context[i]}</span>`;
      } else {
        html += q.context[i];
      }
    }
    html += `</div>`;
    contextEl.innerHTML = html;
  } else {
    displayEl.style.display = "";
    contextEl.style.display = "none";
    displayEl.textContent = q.char;
  }

  document.getElementById("feedback").textContent = "";
  document.getElementById("answerInput").value = "";
  document.getElementById("answerInput").focus();
  updateProgress();
  updateScoreDisplay();
}

function updateProgress() {
  document.getElementById("progress").textContent = 
    `${currentIndex + 1} / ${currentQuestions.length}`;
}

function updateScoreDisplay() {
  document.getElementById("score").textContent = `⭐ ${score}`;
}

// ===== 輸入判斷 =====
document.getElementById("answerInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") checkAnswer();
});

function checkAnswer() {
  const input = document.getElementById("answerInput").value.trim().toUpperCase();
  const q = currentQuestions[currentIndex];
  const correct = q.code.toUpperCase().replace(/\s/g, "");
  const userAns = input.replace(/\s/g, "");
  const fb = document.getElementById("feedback");

  if (userAns === correct) {
    fb.textContent = "✅ 正確！";
    fb.className = "feedback correct";
    score += 10; correctCount++; currentIndex++;
    setTimeout(loadQuestion, 250);
  } else {
    fb.textContent = `❌ 答錯了，正確是：${q.code}`;
    fb.className = "feedback wrong";
    wrongList.push(q.char);
    score = Math.max(0, score - 3);
    setTimeout(() => { currentIndex++; loadQuestion(); }, 1000);
  }
  updateScoreDisplay();
}

// ===== 按鈕 =====
function skipQuestion() { currentIndex++; loadQuestion(); }
function quitPractice() { clearInterval(timerInterval); showLevels(); }

// ===== 結束 =====
function endLevel() {
  clearInterval(timerInterval);
  const total = currentQuestions.length;
  const accuracy = total > 0 ? Math.round((correctCount / total) * 100) : 0;
  const wpm = seconds > 0 ? Math.round((correctCount / seconds) * 60) : 0;
  saveScore(currentLevel.id, { score, correctCount, total, accuracy, wpm, seconds, wrongList });

  document.getElementById("resultContent").innerHTML = `
    <p>⭐ 得分：${score}</p>
    <p>✅ 答對：${correctCount} / ${total}</p>
    <p>🎯 準確率：${accuracy}%</p>
    <p>⚡ 速度：${wpm} 字／分鐘</p>
    <p>⏱ 用時：${seconds} 秒</p>
    ${wrongList.length ? `<p>📝 錯題：${wrongList.join("、")}</p>` : "<p>🎉 全對！太厲害了！</p>"}
  `;
  showScreen("screen-result");
}

// ===== 儲存 =====
function saveScore(levelId, data) {
  const key = "cangjie_scores_" + currentUser;
  const all = JSON.parse(localStorage.getItem(key) || "{}");
  const prev = all[levelId];
  if (!prev || data.score > prev.score) all[levelId] = data;
  localStorage.setItem(key, JSON.stringify(all));
}

function showScores() {
  const key = "cangjie_scores_" + currentUser;
  const all = JSON.parse(localStorage.getItem(key) || "{}");
  let html = `<p><strong>學生：</strong>${currentUser}</p><hr style="margin:12px 0">`;
  if (Object.keys(all).length === 0) {
    html += "<p>還沒有成績記錄，快去練習吧！</p>";
  } else {
    LEVELS.forEach(lv => {
      const s = all[lv.id];
      if (s) html += `<p><strong>第 ${lv.id} 關：${lv.name}</strong><br>
        得分 ${s.score}｜準確率 ${s.accuracy}%｜速度 ${s.wpm} 字/分</p>`;
    });
  }
  document.getElementById("scoreContent").innerHTML = html;
  showScreen("screen-scores");
}

// ===== 工具 =====
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

// ===== 初始化 =====
showScreen("screen-login");
</script>
